[project]
name = "ai-pirates-game"
version = "1.0.0"
description = "Economic model and complete-policy election calculator for AI Pirates Game"
requires-python = ">=3.13"
dependencies = ["numpy==2.4.6"]

[dependency-groups]
dev = [
  "ruff==0.16.8",
  "uv==0.12.15",
  "workers-py==1.17.3",
  "workers-runtime-sdk==1.8.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
